name: Profile dashboard assets

# Generates the contribution snake, the 3D contribution graph, and the
# interactive 3D page (web/) with its data, then publishes them to the
# `output` branch. GitHub Pages serves that branch.
on:
  push:
    branches: [profile-previews]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D graphs
        run: cp profile-3d-contrib/*.svg dist/

      - name: Build interactive 3D page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/contributions_json.py "${{ github.repository_owner }}" dist/contributions.json
          cp web/index.html dist/index.html
          touch dist/.nojekyll

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
